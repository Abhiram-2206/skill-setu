<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Setu — Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar" id="navbar">
    <div class="nav-inner">
        <a href="/" class="nav-logo">
            <img src="/static/logo.jpeg" alt="Skill Setu Logo" class="logo-img">
            <span class="brand-name">Skill Setu</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/about" class="nav-link">About</a>
            <a href="/resume" class="nav-link">Resume Analyser</a>
            <a href="/dashboard" class="nav-cta">Launch App →</a>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" style="display:none"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
        </div>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Create account</h1>
            <p>Join Skill Setu and start your learning journey</p>
        </div>

        {% if error %}
        <div class="auth-error">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <!-- OAuth buttons -->
        <div class="oauth-group">
            <a href="/auth/google" class="oauth-btn oauth-google">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.45 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Sign up with Google
            </a>
        </div>
        </div>

        <div class="auth-divider"><span>or create with email</span></div>

        <form method="POST" action="/register" class="auth-form">
            <div class="input-group">
                <label class="input-label">Full Name</label>
                <input type="text" name="name" class="auth-input" placeholder="Your name"
                       value="{{ name or '' }}" required autocomplete="name">
            </div>
            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" name="email" class="auth-input" placeholder="you@example.com"
                       value="{{ email or '' }}" required autocomplete="email">
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" name="password" class="auth-input" placeholder="Min. 6 characters"
                       required autocomplete="new-password">
            </div>
            <div class="input-group">
                <label class="input-label">Confirm Password</label>
                <input type="password" name="confirm" class="auth-input" placeholder="Repeat password"
                       required autocomplete="new-password">
            </div>
            <button type="submit" class="generate-btn" style="width:100%;margin-top:8px;">
                Create Account
            </button>
        </form>

        <p class="auth-switch">
            Already have an account? <a href="/login">Sign in</a>
        </p>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
