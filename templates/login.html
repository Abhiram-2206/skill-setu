<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Setu — Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar" id="navbar">
    <div class="nav-inner">
        <a href="/" class="nav-logo">
            <img src="/static/logo.jpeg" alt="Skill Setu Logo" class="logo-img">
            <span class="brand-name">Skill Setu</span>
        </a>
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/about" class="nav-link">About</a>
            <a href="/resume" class="nav-link">Resume Analyser</a>
            <a href="/dashboard" class="nav-cta">Launch App →</a>
            <button class="theme-toggle" id="themeToggle" title="Toggle theme">
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M21 12.79A9 9 0 1111.21 3a7 7 0 109.79 9.79z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" style="display:none"><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
        </div>
    </div>
</nav>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Welcome back</h1>
            <p>Sign in to your Skill Setu account</p>
        </div>

        {% if error %}
        <div class="auth-error">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.8"/><path d="M12 8v4M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            {{ error }}
        </div>
        {% endif %}

        <!-- OAuth buttons -->
        <div class="oauth-group">
            <a href="/auth/google" class="oauth-btn oauth-google">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                Continue with Google
            </a>
            <a href="/auth/linkedin" class="oauth-btn oauth-linkedin">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#0A66C2"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                Continue with LinkedIn
            </a>
            <div class="oauth-row">
                <a href="/auth/facebook" class="oauth-btn oauth-facebook oauth-half">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                    Facebook
                </a>
                <a href="/auth/yahoo" class="oauth-btn oauth-yahoo oauth-half">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#6001D2"><path d="M0 4.2h4.2l3.6 7.2 3.6-7.2H15.6L9 17.4v6H5.4v-6L0 4.2zm15.6 13.2l2.4-4.8L24 4.2h-4.2l-2.4 4.8-2.4-4.8H10.8l4.8 9.6v4.2h4.2v-4.2l-4.2-4.8z"/></svg>
                    Yahoo
                </a>
            </div>
        </div>

        <div class="auth-divider"><span>or sign in with email</span></div>

        <!-- Email/password form -->
        <form method="POST" action="/login" class="auth-form">
            <div class="input-group">
                <label class="input-label">Email</label>
                <input type="email" name="email" class="auth-input" placeholder="you@example.com"
                       value="{{ email or '' }}" required autocomplete="email">
            </div>
            <div class="input-group">
                <label class="input-label">Password</label>
                <input type="password" name="password" class="auth-input" placeholder="••••••••"
                       required autocomplete="current-password">
            </div>
            <div class="auth-remember">
                <label class="check-label">
                    <input type="checkbox" name="remember">
                    <span>Remember me</span>
                </label>
            </div>
            <button type="submit" class="generate-btn" style="width:100%;margin-top:8px;">
                Sign In
            </button>
        </form>

        <p class="auth-switch">
            Don't have an account? <a href="/register">Create one</a>
        </p>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
